---
# Example secrets configuration for Connect Secret Registry
# This file demonstrates how to structure secrets for the Kafka Connect Secret Registry
#
# Structure:
# - path: Single word path for organizing secrets
# - key: The key name within the path
# - secret: The actual secret value
#
# Connect Secret Registry stores secrets in the _confluent-secrets topic
# and makes them available to connectors via config providers
#
# Connector Usage Examples:
# In connector configuration, reference secrets using:
# ${secrettransform:PATH:KEY:CONFIG_PROVIDER}
# e.g., ${secrettransform:database:password:secret}

secrets:
  # Database connection secrets
  - path: "database"
    key: "username"
    secret: "mysql_user"

  - path: "database"
    key: "password"
    secret: "supersecret1234567890"

  - path: "database"
    key: "host"
    secret: "mysql.dev.example.com"

  - path: "staging"
    key: "username"
    secret: "mysql_stage_user"

  - path: "staging"
    key: "password"
    secret: "stagepass456"

  # API keys for external services
  - path: "salesforce"
    key: "client_id"
    secret: "sf_client_abc123"

  - path: "salesforce"
    key: "client_secret"
    secret: "sf_secret_xyz789"

  # S3 credentials
  - path: "s3"
    key: "access_key_id"
    secret: "AKIAIOSFODNN7EXAMPLE"

  - path: "s3"
    key: "secret_access_key"
    secret: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"

  # Kafka Connect credentials
  - path: "connect"
    key: "admin_password"
    secret: "connect_admin_pass"

  # SSL/TLS certificates and keys
  - path: "certificates"
    key: "keystore_password"
    secret: "keystore_pass123"

  - path: "certificates"
    key: "truststore_password"
    secret: "truststore_pass456"

