---
# Manage Secrets in Kafka Connect Secret Registry
# This playbook manages secrets stored in the Connect Secret Registry
# which stores secrets in a Kafka topic (default: _confluent-secrets)
#
# The Secret Registry uses a hierarchical path-based structure:
# - paths: Organize secrets like directories (e.g., "mysql/production")
# - keys: Individual secret keys within a path (e.g., "password")
# - secrets: The actual secret values
# - versions: Each key can have multiple versions
#
# API Endpoints used:
# - GET /secret/paths - List all paths
# - GET /secret/paths/{path}/keys - List keys in a path
# - GET /secret/paths/{path}/keys/{key}/versions/latest - Get latest secret
# - POST /secret/paths/{path}/keys/{key}/versions - Create new secret version
# - DELETE /secret/paths/{path}/keys/{key} - Delete all versions of a key
#
# Example usage:
# ansible-playbook secretsregistry_management.yml -e @examples/secrets_example.yml
#
# Required variables:
# - rest_server_url: Connect REST API URL (e.g., http://connect.example.com:8083)
# - rest_user/rest_user_password: Authentication credentials
# - secrets: List of secrets with path/key/secret structure

- name: Manage Connect Secret Registry
  hosts: "{{ run_host|default('localhost') }}"
  environment: "{{proxy_env}}"
  gather_facts: false
  tasks:
    - name: Set Variables
      import_role:
        name: common

    - name: Process Secrets Registry
      import_role:
        name: secretsregistry
