---
# build a configuration structure from current state of topics/configs in the cluster
# Requires Confluent Platform 7.0 or later: the topics list must carry
# partitions_count, and the /topics/-/configs batch endpoint must be available.
- name: Get Topics List
  uri:
    url: "{{rest_server_url}}/kafka/v3/clusters/{{cluster_id}}/topics"
    method: GET
    validate_certs: true
    client_cert: "{{ none if client_tls_cert is not defined else client_tls_cert }}"
    client_key: "{{ none if client_tls_key is not defined else client_tls_key }}"
    ca_path: "{{ none if ca_tls_path is not defined else ca_tls_path }}"
    force_basic_auth: true
    headers:
      Authorization: "{{ authorization_header }}"
    body_format: json
    timeout: "{{ api_timeout }}"
  register: topics_list_temp
  check_mode: false

- name: Set Only Essential Fields and Non-protected Topics
  set_fact:
    topics_list: "{{ _kept | json_query('[].{topic_name: topic_name, replication_factor: replication_factor, partitions_count: partitions_count}') }}"
  vars:
    _whitelisted: "{{ (topics_list_temp.json.data | d([]) | selectattr('topic_name', 'search', topic_whitelist) | list)
      if topic_whitelist | length > 0 else [] }}"
    _kept: "{{ (_whitelisted | rejectattr('topic_name', 'search', topic_protected) | list) if topic_protected | length > 0 else _whitelisted }}"

- name: Assert Topics List Carries Partition Counts
# pre-7.0 responses omit partitions_count, which would surface downstream as a
# null comparison in the delta rather than an actionable error here
  ansible.builtin.assert:
    that: topics_list | selectattr('partitions_count', 'none') | list | length == 0
    fail_msg: >-
      The topics API did not return partitions_count for
      {{ topics_list | selectattr('partitions_count', 'none') | map(attribute='topic_name') | join(', ') }} -
      Confluent Platform 7.0 or later is required.
    success_msg: Topics list carries partition counts
  when: topics_list | length > 0

- name: Get All Topic Configs
# single batch call for every topic's configs instead of one call per topic
  uri:
    url: "{{rest_server_url}}/kafka/v3/clusters/{{cluster_id}}/topics/-/configs"
    method: GET
    validate_certs: true
    client_cert: "{{ none if client_tls_cert is not defined else client_tls_cert }}"
    client_key: "{{ none if client_tls_key is not defined else client_tls_key }}"
    ca_path: "{{ none if ca_tls_path is not defined else ca_tls_path }}"
    force_basic_auth: true
    headers:
      Authorization: "{{ authorization_header }}"
    body_format: json
    status_code: 200
    timeout: "{{ api_timeout }}"
  register: configs_list_all
  check_mode: false
  when: topics_list | length > 0

- name: Build Current Topics State
  set_fact:
    topics_current: "{{ topics_current | d([]) + [item | combine({'configs': _configs})] }}"
  loop: "{{ topics_list }}"
  vars:
    _configs: "{{ configs_list_all.json.data | d([])
      | selectattr('topic_name', 'equalto', item.topic_name)
      | rejectattr('source', 'in', ['DEFAULT_CONFIG', 'STATIC_BROKER_CONFIG'])
      | json_query('[].{name: name, value: value}') }}"
  when: topics_list | length > 0
