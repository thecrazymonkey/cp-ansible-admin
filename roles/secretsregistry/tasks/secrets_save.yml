---
# Write current secrets state to a file with proper structure for Connect Secret Registry
- name: Save current state to file
  copy:
    content: |
      # Generated by Ansible at {{ ansible_date_time.iso8601 }}
      # Current secrets from Connect Secret Registry
      # Structure: path/key/secret format for Connect Secret Registry API

      secrets:
      {% for secret in secrets_current %}
        - path: "{{ secret.path }}"
          key: "{{ secret.key }}"
          secret: "{{ secret.secret }}"
          version: {{ secret.version | default(1) }}
          metadata:
            created_time: "{{ secret.created_time | default('') }}"
            modified_time: "{{ secret.modified_time | default('') }}"
            topic: "{{ secret.metadata.topic | default(secret_topic) }}"
            group_id: "{{ secret.metadata.group_id | default(secret_group_id) }}"
            connect_cluster: "{{ secret.metadata.connect_cluster | default(connect_cluster_id) }}"
            kafka_cluster: "{{ secret.metadata.kafka_cluster | default(kafka_cluster_id) }}"
      {% endfor %}

      # Protected secrets pattern: {{ secret_protected }}
      # Secret whitelist pattern: {{ secret_whitelist }}
      # Connect Server: {{ rest_server_url }}
    dest: "{{ secret_dump_destination }}"
    mode: '0600'
  when: secret_dump_file|bool
  delegate_to: localhost

- name: Save current state to backup file
  copy:
    content: |
      # Backup generated by Ansible at {{ ansible_date_time.iso8601 }}
      # Backup of secrets from Connect Secret Registry before changes
      # Structure: path/key/secret format for Connect Secret Registry API

      secrets:
      {% for secret in secrets_current %}
        - path: "{{ secret.path }}"
          key: "{{ secret.key }}"
          secret: "{{ secret.secret }}"
          version: {{ secret.version | default(1) }}
          metadata:
            created_time: "{{ secret.created_time | default('') }}"
            modified_time: "{{ secret.modified_time | default('') }}"
            topic: "{{ secret.metadata.topic | default(secret_topic) }}"
            group_id: "{{ secret.metadata.group_id | default(secret_group_id) }}"
            connect_cluster: "{{ secret.metadata.connect_cluster | default(connect_cluster_id) }}"
            kafka_cluster: "{{ secret.metadata.kafka_cluster | default(kafka_cluster_id) }}"
      {% endfor %}

      # Protected secrets pattern: {{ secret_protected }}
      # Secret whitelist pattern: {{ secret_whitelist }}
      # Connect Server: {{ rest_server_url }}
    dest: "{{ secret_backup_destination }}"
    mode: '0600'
  when: secret_backup_enabled|bool
  delegate_to: localhost
