---

- name: Get current schema registry mode
  ansible.builtin.uri:
    url: "{{ curl_mode_api_url | trim }}"
    method: GET
    validate_certs: true
    client_cert: "{{ none if client_tls_cert is not defined else client_tls_cert }}"
    client_key: "{{ none if client_tls_key is not defined else client_tls_key }}"
    ca_path: "{{ none if ca_tls_path is not defined else ca_tls_path }}"
    headers:
      Authorization: "{{ authorization_header }}"
    return_content: true
    status_code: 200
  register: current_mode_result
  check_mode: false

- name: Update to read write mode globally before updating the schemas
  ansible.builtin.uri:
    url: "{{ curl_mode_api_url | trim }}"
    method: PUT
    validate_certs: true
    client_cert: "{{ none if client_tls_cert is not defined else client_tls_cert }}"
    client_key: "{{ none if client_tls_key is not defined else client_tls_key }}"
    ca_path: "{{ none if ca_tls_path is not defined else ca_tls_path }}"
    headers:
      Authorization: "{{ authorization_header }}"
      Content-Type: application/vnd.schemaregistry.v1+json
    body_format: json
    body:
      mode: "READWRITE"
    status_code: 200
    return_content: true
  register: mode_result
  changed_when: mode_result.status == 200
  when: current_mode_result.json.mode | d('') != 'READWRITE'

# =============================================================================
# Normalize all input levels into a single flat list: all_schema_operations
# Each entry has: _subject_name, _compatibility, _schema_file_src_path,
#                 _schema_type, _schema_update, _schema_delete_all, _schema_delete_curr
# =============================================================================

# --- Topic level: value subjects ---
- name: Build topic-level value entries
  ansible.builtin.set_fact:
    _topic_value_ops: >-
      {{ _topic_value_ops | d([]) + [{
        '_subject_name': item.name ~ '-value',
        '_compatibility': item.value.compatibility | d(compatibility),
        '_schema_file_src_path': item.value.schema_file_src_path,
        '_schema_type': ('avro' if '.avsc' in item.value.schema_file_src_path
                         else ('protobuf' if '.proto' in item.value.schema_file_src_path
                         else 'json')),
        '_schema_update': item.value.schema_update | d(schema_update),
        '_schema_delete_all': item.value.schema_delete_all | d(schema_delete_all),
        '_schema_delete_curr': item.value.schema_delete_curr | d(schema_delete_curr)
      }] }}
  loop: "{{ schemas.topics | d([]) }}"
  when:
    - item.value is defined
    - item.name | regex_search(topic_protected) == none

# --- Topic level: key subjects ---
- name: Build topic-level key entries
  ansible.builtin.set_fact:
    _topic_key_ops: >-
      {{ _topic_key_ops | d([]) + [{
        '_subject_name': item.name ~ '-key',
        '_compatibility': item.key.compatibility | d(compatibility),
        '_schema_file_src_path': item.key.schema_file_src_path,
        '_schema_type': ('avro' if '.avsc' in item.key.schema_file_src_path
                         else ('protobuf' if '.proto' in item.key.schema_file_src_path
                         else 'json')),
        '_schema_update': item.key.schema_update | d(schema_update),
        '_schema_delete_all': item.key.schema_delete_all | d(schema_delete_all),
        '_schema_delete_curr': item.key.schema_delete_curr | d(schema_delete_curr)
      }] }}
  loop: "{{ schemas.topics | d([]) }}"
  when:
    - item.key is defined
    - item.name | regex_search(topic_protected) == none

# --- TopicRecord level: value record schemas ---
- name: Build topic-record value entries
  ansible.builtin.set_fact:
    _topicrecord_value_ops: >-
      {{ _topicrecord_value_ops | d([]) + [{
        '_subject_name': item.0.name ~ '-' ~ item.1.record_name ~ '-value',
        '_compatibility': item.1.compatibility | d(compatibility),
        '_schema_file_src_path': item.1.schema_file_src_path,
        '_schema_type': ('avro' if '.avsc' in item.1.schema_file_src_path
                         else ('protobuf' if '.proto' in item.1.schema_file_src_path
                         else 'json')),
        '_schema_update': item.1.schema_update | d(schema_update),
        '_schema_delete_all': item.1.schema_delete_all | d(schema_delete_all),
        '_schema_delete_curr': item.1.schema_delete_curr | d(schema_delete_curr)
      }] }}
  loop: >-
    {{ schemas.topics | d([])
       | selectattr('value.record_schemas', 'defined')
       | subelements('value.record_schemas') }}
  when:
    - item.0.value is defined
    - item.0.value.record_schemas is defined
    - item.0.name | regex_search(topic_protected) == none

# --- TopicRecord level: key record schemas ---
- name: Build topic-record key entries
  ansible.builtin.set_fact:
    _topicrecord_key_ops: >-
      {{ _topicrecord_key_ops | d([]) + [{
        '_subject_name': item.0.name ~ '-' ~ item.1.record_name ~ '-key',
        '_compatibility': item.1.compatibility | d(compatibility),
        '_schema_file_src_path': item.1.schema_file_src_path,
        '_schema_type': ('avro' if '.avsc' in item.1.schema_file_src_path
                         else ('protobuf' if '.proto' in item.1.schema_file_src_path
                         else 'json')),
        '_schema_update': item.1.schema_update | d(schema_update),
        '_schema_delete_all': item.1.schema_delete_all | d(schema_delete_all),
        '_schema_delete_curr': item.1.schema_delete_curr | d(schema_delete_curr)
      }] }}
  loop: >-
    {{ schemas.topics | d([])
       | selectattr('key.record_schemas', 'defined')
       | subelements('key.record_schemas') }}
  when:
    - item.0.key is defined
    - item.0.key.record_schemas is defined
    - item.0.name | regex_search(topic_protected) == none

# --- Record level ---
- name: Build record-level entries
  ansible.builtin.set_fact:
    _record_ops: >-
      {{ _record_ops | d([]) + [{
        '_subject_name': item.record_name,
        '_compatibility': item.compatibility | d(compatibility),
        '_schema_file_src_path': item.schema_file_src_path,
        '_schema_type': ('avro' if '.avsc' in item.schema_file_src_path
                         else ('protobuf' if '.proto' in item.schema_file_src_path
                         else 'json')),
        '_schema_update': item.schema_update | d(schema_update),
        '_schema_delete_all': item.schema_delete_all | d(schema_delete_all),
        '_schema_delete_curr': item.schema_delete_curr | d(schema_delete_curr)
      }] }}
  loop: "{{ schemas.record_schemas | d([]) }}"
  when: schemas.record_schemas is defined

# --- Combine all levels into a single list ---
- name: Combine all schema operations
  ansible.builtin.set_fact:
    all_schema_operations: >-
      {{ _topic_value_ops | d([])
         + _topic_key_ops | d([])
         + _topicrecord_value_ops | d([])
         + _topicrecord_key_ops | d([])
         + _record_ops | d([]) }}

- name: Debug all schema operations
  ansible.builtin.debug:
    var: all_schema_operations

# =============================================================================
# Get current subjects and optionally delete all
# =============================================================================

- name: Get Current Subjects
  ansible.builtin.uri:
    url: "{{ sr_server_url }}/subjects"
    method: GET
    validate_certs: true
    client_cert: "{{ none if client_tls_cert is not defined else client_tls_cert }}"
    client_key: "{{ none if client_tls_key is not defined else client_tls_key }}"
    ca_path: "{{ none if ca_tls_path is not defined else ca_tls_path }}"
    headers:
      Authorization: "{{ authorization_header }}"
    return_content: true
  register: subjects_result
  until: subjects_result is not failed
  retries: 5
  delay: 1
  check_mode: false

- name: Set current subject list
  ansible.builtin.set_fact:
    subject_list_curr: "{{ subjects_result.json }}"

- name: Delete all versions of the schemas for the existing subjects
  ansible.builtin.uri:
    url: "{{ curl_subjects_api_url | trim }}/{{ item }}"
    method: DELETE
    validate_certs: true
    client_cert: "{{ none if client_tls_cert is not defined else client_tls_cert }}"
    client_key: "{{ none if client_tls_key is not defined else client_tls_key }}"
    ca_path: "{{ none if ca_tls_path is not defined else ca_tls_path }}"
    headers:
      Authorization: "{{ authorization_header }}"
    status_code: [200, 404]
  with_items: "{{ subject_list_curr | d([]) }}"
  when: delete_all_schemas | bool

- name: Deliberate Fail
  ansible.builtin.fail:
    msg: "Deliberate Failing"
  when: delete_all_schemas | bool

# =============================================================================
# Create and Delete schemas using the unified flat list
# =============================================================================

- name: Update Compatibility and Create Schemas
  ansible.builtin.include_tasks: schemas_create.yml
  loop: "{{ all_schema_operations }}"
  loop_control:
    loop_var: itemin
  vars:
    http_status_code: 200
  when:
    - all_schema_operations | length > 0
    - not ansible_check_mode

- name: Delete Schemas
  ansible.builtin.include_tasks: schemas_delete.yml
  loop: "{{ all_schema_operations }}"
  loop_control:
    loop_var: itemin
  vars:
    http_status_code: 200
  when:
    - all_schema_operations | length > 0
    - not ansible_check_mode

# =============================================================================
# Cleanup certificate files
# =============================================================================

- name: Remove the Certificate Key File from the controller node
  ansible.builtin.file:
    path: "{{ key_file_path }}"
    state: absent

- name: Remove the Certificate File from the controller node
  ansible.builtin.file:
    path: "{{ crt_file_path }}"
    state: absent

- name: Remove the Root Certificate File from the controller node
  ansible.builtin.file:
    path: "{{ rootcrt_file_path }}"
    state: absent
