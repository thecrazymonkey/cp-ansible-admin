---
# build a configuration structure from current state of connectors in the cluster
- name: Initialize connectors current state
  ansible.builtin.set_fact:
    connectors_current: []

- name: Get All Connectors With Configs
# single batch call (?expand=info) instead of one config call per connector
  ansible.builtin.uri:
    url: "{{connectors_server_url}}/connectors?expand=info"
    method: GET
    validate_certs: true
    force_basic_auth: true
    client_cert: "{{ none if client_tls_cert is not defined else client_tls_cert }}"
    client_key: "{{ none if client_tls_key is not defined else client_tls_key }}"
    ca_path: "{{ none if ca_tls_path is not defined else ca_tls_path }}"
    force: true
    headers:
      Authorization: "{{ authorization_header }}"
    timeout: "{{ api_timeout }}"
  register: connectors_list_tmp
  check_mode: false

- name: Assert Connect Expanded The Connector List
# Connect older than 5.5 ignores ?expand= and returns a plain list of names.
# Fail loudly rather than build an empty current state, which would make every
# existing connector look like it needs creating.
  ansible.builtin.assert:
    that: connectors_list_tmp.json is mapping
    fail_msg: >-
      {{ connectors_server_url }}/connectors?expand=info returned a plain connector
      list instead of an expanded map - Kafka Connect 5.5 or later is required.
    success_msg: Connect returned an expanded connector map
  when: connectors_list_tmp.json | d([]) | length > 0

- name: Build connectors current state
  ansible.builtin.set_fact:
    connectors_current: "{{ connectors_list_tmp.json | dict2items | map(attribute='value.info.config') | list }}"
  when: connectors_list_tmp.json | d({}) | length > 0

- name: Debug connectors current state
  ansible.builtin.debug:
    var: connectors_current
    verbosity: 3
